<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora Vila Azular</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #e8f7fb, #f8fbfc);
            color: #17324d;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .card {
            background: rgba(255, 255, 255, 0.97);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 15px 45px rgba(22, 71, 92, 0.15);
            border: 1px solid rgba(255,255,255,0.8);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-icon {
            font-size: 42px;
            display: block;
            margin-bottom: 8px;
        }

        h1 {
            margin: 0;
            font-size: 30px;
            font-weight: 700;
            color: #126782;
        }

        .subtitle {
            margin: 7px 0 0;
            color: #71808c;
            font-size: 15px;
        }

        .divider {
            height: 1px;
            background: #e8eef1;
            margin: 25px 0;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
            color: #345066;
        }

        input,
        select {
            width: 100%;
            height: 50px;
            padding: 0 15px;
            border: 1px solid #d8e3e8;
            border-radius: 12px;
            background: #f9fcfd;
            color: #17324d;
            font-size: 16px;
            outline: none;
            transition: 0.2s;
        }

        input:focus,
        select:focus {
            border-color: #1993b5;
            box-shadow: 0 0 0 3px rgba(25, 147, 181, 0.12);
            background: white;
        }

        button {
            width: 100%;
            height: 54px;
            margin-top: 8px;
            border: none;
            border-radius: 13px;
            background: linear-gradient(135deg, #087fa3, #18a4c4);
            color: white;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(8, 127, 163, 0.25);
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 11px 22px rgba(8, 127, 163, 0.32);
        }

        button:active {
            transform: translateY(0);
        }

        #resultado {
            margin-top: 25px;
            padding: 22px 15px;
            border-radius: 15px;
            background: #eef9fb;
            text-align: center;
            color: #086b87;
            font-size: 28px;
            font-weight: 700;
            min-height: 76px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #91a0aa;
        }

        @media (max-width: 500px) {
            body {
                padding: 12px;
                align-items: flex-start;
                padding-top: 25px;
            }

            .card {
                padding: 24px 20px;
                border-radius: 20px;
            }

            h1 {
                font-size: 27px;
            }

            .logo-icon {
                font-size: 38px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">

            <div class="logo">
                <span class="logo-icon">🏖️</span>
                <h1>Vila Azular</h1>
                <p class="subtitle">Calculadora de Diárias</p>
            </div>

            <div class="divider"></div>

            <div class="field">
                <label for="hospedes">👥 Número de hóspedes</label>
                <input
                    type="number"
                    id="hospedes"
                    value="12"
                    min="1"
                    placeholder="Ex.: 12"
                >
            </div>

            <div class="field">
                <label for="noites">🌙 Número de noites</label>
                <input
                    type="number"
                    id="noites"
                    value="2"
                    min="1"
                    placeholder="Ex.: 2"
                >
            </div>

            <div class="field">
                <label for="temporada">📅 Temporada</label>
                <select id="temporada">
                    <option value="1">Normal</option>
                    <option value="1.3">Alta</option>
                    <option value="1.7">Feriado</option>
                </select>
            </div>

            <button onclick="calcular()">
                CALCULAR VALOR
            </button>

            <div id="resultado">
                R$ 1.000,00
            </div>

        </div>

        <div class="footer">
            Vila Azular • Ubatuba/SP
        </div>

    </div>


    <script>

        function calcular() {

            const hospedes = Number(
                document.getElementById("hospedes").value
            );

            const noites = Number(
                document.getElementById("noites").value
            );

            const temporada = Number(
                document.getElementById("temporada").value
            );

            const diariaBase = 500;

            const valor = diariaBase * temporada * noites;

            document.getElementById("resultado").innerText =
                "R$ " + valor.toLocaleString("pt-BR", {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                });
        }

    </script>

</body>
</html>
