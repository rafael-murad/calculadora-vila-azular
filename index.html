<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Vila Azular</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            margin-top: 25px;
            cursor: pointer;
        }

        #resultado {
            margin-top: 25px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>🏖️ Vila Azular</h1>

    <p>Calculadora de Diárias</p>

    <label>Número de hóspedes</label>
    <input type="number" id="hospedes" value="12" min="1">

    <label>Número de noites</label>
    <input type="number" id="noites" value="2" min="1">

    <label>Temporada</label>
    <select id="temporada">
        <option value="1">Normal</option>
        <option value="1.3">Alta</option>
        <option value="1.7">Feriado</option>
    </select>

    <button onclick="calcular()">CALCULAR</button>

    <div id="resultado"></div>

</div>

<script>

function calcular() {

    const hospedes = Number(document.getElementById("hospedes").value);
    const noites = Number(document.getElementById("noites").value);
    const temporada = Number(document.getElementById("temporada").value);

    const diariaBase = 500;

    const valor = diariaBase * temporada * noites;

    document.getElementById("resultado").innerText =
        "R$ " + valor.toLocaleString("pt-BR", {
            minimumFractionDigits: 2
        });
}

</script>

</body>
</html>
